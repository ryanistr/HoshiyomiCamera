[package]
name = "hoshiyomi-core"
version = "0.1.0"
edition = "2021"
description = "Stargazer Camera (HoshiyomiCam) native compute core — replaces the prebuilt camera SDK libraries"
license = "MIT"

[lib]
name = "hoshiomi_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["jni"]
jni = ["dep:jni"]

[dependencies]
jni = { version = "0.21", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
# Unwind (not abort) so a malformed camera frame can be caught at the JNI
# boundary instead of killing the app process.
strip = true

[dev-dependencies]
# no external deps for core modules — pure Rust implementations
